name: Build, test and release TCT English

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: 'false'
  Testing__DisableRuntimeCompilation: 'true'
  DOTNET_ENVIRONMENT: Development
  ASPNETCORE_ENVIRONMENT: Development
  Database__ServerVersion: 10.5.23-mariadb
  ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=33307;Database=tct_ci;User=tct_ci;Password=CiDisposableOnly;SslMode=None;

jobs:
  build:
    name: Build, tests and MariaDB migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.x
      - name: Restore and build
        run: |
          dotnet tool restore
          dotnet restore TCTEnglish.Tests/TCTEnglish.Tests.csproj
          dotnet build TCTEnglish.Tests/TCTEnglish.Tests.csproj -c Release --no-restore
      - name: Run application tests
        run: dotnet test TCTEnglish.Tests/TCTEnglish.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory test-results
      - name: Start disposable MariaDB matching hosting
        shell: bash
        run: |
          docker run -d --name tct-ci-mariadb \
            -p 127.0.0.1:33307:3306 \
            -e MARIADB_ROOT_PASSWORD=CiDisposableOnly \
            -e MARIADB_DATABASE=tct_ci -e MARIADB_USER=tct_ci \
            -e MARIADB_PASSWORD=CiDisposableOnly \
            mariadb:10.5.23@sha256:6122f729893e286a3cfc789fb546dd041cf244e4de84272ab5727028ca107730 \
            --lower-case-table-names=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for attempt in {1..60}; do
            if docker exec tct-ci-mariadb sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --protocol=tcp -h127.0.0.1 -uroot -e "SELECT 1"' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'MariaDB did not become ready.' >&2
          exit 1
      - name: Check baseline upgrade, FK indexes and repeat execution
        shell: pwsh
        run: ./scripts/verify-mariadb.ps1
      - name: Publish Windows app and migration bundle
        shell: bash
        run: |
          dotnet publish TCTEnglish/TCTEnglish.csproj -c Release -r win-x64 --self-contained true -o release/app
          python3 scripts/prepare-publish.py release/app
          mkdir -p release/migration
          dotnet ef migrations bundle --project TCTEnglish --startup-project TCTEnglish --configuration Release --self-contained --target-runtime win-x64 --output release/migration/efbundle.exe
          dotnet ef migrations script --project TCTEnglish --startup-project TCTEnglish --configuration Release --no-build --idempotent --output release/migration/migrations.sql
          cd release
          zip -qr ../tctenglish-release.zip app migration
      - name: Upload release artifact without credentials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tctenglish-release
          path: |
            tctenglish-release.zip
            scripts/deploy-plesk.ps1
          retention-days: 14
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn
      - name: Remove disposable database
        if: always()
        run: docker rm -f -v tct-ci-mariadb || true

  release:
    name: Publish approved release and trigger Plesk
    needs: build
    if: github.ref == 'refs/heads/master' && vars.PLESK_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: tctenglish-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tctenglish-release
          path: release-artifact
      - name: Create immutable release, update deployment manifest and notify Plesk
        env:
          GH_TOKEN: ${{ github.token }}
          PLESK_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
        run: python3 scripts/publish-plesk-release.py release-artifact/tctenglish-release.zip
