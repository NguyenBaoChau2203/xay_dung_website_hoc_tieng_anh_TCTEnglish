<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" fill="none" role="img" aria-hidden="true">
  <defs>
    <filter id="empty-clay-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#2136e7" flood-opacity="0.10" />
    </filter>
    <filter id="empty-soft-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#111c2d" flood-opacity="0.08" />
    </filter>
    <linearGradient id="empty-slate" x1="40" y1="30" x2="160" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f3ff" />
      <stop offset="100%" stop-color="#d8e3fb" />
    </linearGradient>
    <linearGradient id="empty-lens" x1="120" y1="60" x2="180" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7284ff" />
      <stop offset="100%" stop-color="#4255ff" />
    </linearGradient>
    <linearGradient id="empty-accent" x1="130" y1="70" x2="170" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="100%" stop-color="#ffcd1f" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="120" cy="90" r="70" fill="#f0f3ff" />

  <!-- Video Slate Card (Clay) -->
  <rect x="45" y="40" width="120" height="85" rx="16" fill="url(#empty-slate)" filter="url(#empty-clay-drop)" />
  <rect x="55" y="52" width="100" height="6" rx="3" fill="#cbd5e1" opacity="0.6" />
  <rect x="55" y="66" width="70" height="5" rx="2.5" fill="#e2e8f0" />
  <rect x="55" y="77" width="50" height="5" rx="2.5" fill="#e2e8f0" />

  <!-- Play Icon Outline on Slate -->
  <path d="M 95 90 L 110 100 L 95 110 Z" fill="#94a3b8" opacity="0.4" />

  <!-- Floating Magnifying Glass (Clay) -->
  <circle cx="148" cy="100" r="28" stroke="url(#empty-lens)" stroke-width="8" fill="#ffffff" filter="url(#empty-soft-drop)" />
  <!-- Glass Reflection -->
  <path d="M 132 88 A 20 20 0 0 1 158 88" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <!-- Lens Inner Sparkle -->
  <circle cx="148" cy="100" r="6" fill="url(#empty-accent)" />
  <!-- Glass Handle -->
  <rect x="168" y="120" width="12" height="26" rx="6" transform="rotate(-45 168 120)" fill="url(#empty-lens)" filter="url(#empty-soft-drop)" />
</svg>
