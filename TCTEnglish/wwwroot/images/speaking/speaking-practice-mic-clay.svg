<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none" role="img" aria-hidden="true">
  <defs>
    <filter id="mic-clay-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#2136e7" flood-opacity="0.16" />
    </filter>
    <linearGradient id="mic-bubble" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f3ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="mic-blue-grad" x1="60" y1="35" x2="100" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7284ff" />
      <stop offset="100%" stop-color="#4255ff" />
    </linearGradient>
  </defs>

  <!-- Ambient Clay Disc -->
  <circle cx="80" cy="80" r="68" fill="url(#mic-bubble)" filter="url(#mic-clay-drop)" />
  <circle cx="80" cy="80" r="54" stroke="#4255ff" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="6 4" />

  <!-- Stand Arc -->
  <path d="M 60 70 C 60 96 100 96 100 70" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none" />
  <line x1="80" y1="94" x2="80" y2="114" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <line x1="68" y1="114" x2="92" y2="114" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />

  <!-- Capsule Body -->
  <rect x="68" y="42" width="24" height="42" rx="12" fill="url(#mic-blue-grad)" filter="url(#mic-clay-drop)" />
  <path d="M 72 48 A 8 8 0 0 1 88 48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
</svg>
