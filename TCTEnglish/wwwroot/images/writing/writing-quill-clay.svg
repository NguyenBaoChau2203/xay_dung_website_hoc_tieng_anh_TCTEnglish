<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none" role="img" aria-hidden="true">
  <defs>
    <filter id="quill-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#2136e7" flood-opacity="0.18" />
    </filter>
    <filter id="quill-soft" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#111c2d" flood-opacity="0.12" />
    </filter>
    <linearGradient id="quill-barrel" x1="50" y1="20" x2="110" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7284ff" />
      <stop offset="50%" stop-color="#4255ff" />
      <stop offset="100%" stop-color="#2136e7" />
    </linearGradient>
    <linearGradient id="quill-gold" x1="90" y1="100" x2="125" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="50%" stop-color="#ffcd1f" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="ink-curve" x1="30" y1="110" x2="130" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2136e7" />
      <stop offset="60%" stop-color="#4255ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Disk -->
  <circle cx="80" cy="80" r="66" fill="#eef2ff" opacity="0.8" />

  <!-- Flowing Ink Writing Trail -->
  <path d="M 40 134 C 65 142 85 130 105 135 C 112 136 118 133 124 128" stroke="url(#ink-curve)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="38" cy="133" r="3.5" fill="#2136e7" />

  <!-- Fountain Pen at 45 degree angle -->
  <g transform="rotate(45 80 80)" filter="url(#quill-shadow)">
    <!-- Pen Body / Barrel -->
    <rect x="73" y="14" width="14" height="74" rx="7" fill="url(#quill-barrel)" />
    <!-- Barrel Highlight -->
    <path d="M 76 22 L 76 78" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

    <!-- Pen Collar / Ring -->
    <rect x="72" y="85" width="16" height="6" rx="2" fill="url(#quill-gold)" />

    <!-- Pen Grip Section -->
    <path d="M 74 91 L 76 106 L 84 106 L 86 91 Z" fill="#1e293b" />

    <!-- Golden Nib -->
    <path d="M 75 106 L 80 126 L 85 106 Z" fill="url(#quill-gold)" />
    <circle cx="80" cy="112" r="1.5" fill="#1e293b" />
    <line x1="80" y1="112" x2="80" y2="126" stroke="#1e293b" stroke-width="0.8" />

    <!-- Top Cap End -->
    <circle cx="80" cy="16" r="5" fill="url(#quill-gold)" />
  </g>

  <!-- Sparkles -->
  <path d="M 124 38 Q 128 38 128 34 Q 128 38 132 38 Q 128 38 128 42 Q 128 38 124 38 Z" fill="#ffcd1f" />
  <path d="M 32 74 Q 36 74 36 70 Q 36 74 40 74 Q 36 74 36 78 Q 36 74 32 74 Z" fill="#4255ff" opacity="0.8" />
  <circle cx="128" cy="98" r="3" fill="#10b981" opacity="0.75" />
</svg>