<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" fill="none" role="img" aria-hidden="true">
  <defs>
    <!-- Soft Clay Filters -->
    <filter id="clay-banner-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#2136e7" flood-opacity="0.14" />
    </filter>
    <filter id="clay-soft-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#111c2d" flood-opacity="0.10" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="notebook-bg" x1="40" y1="30" x2="220" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f3ff" />
      <stop offset="100%" stop-color="#d8e3fb" />
    </linearGradient>
    <linearGradient id="notebook-cover" x1="30" y1="20" x2="230" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7284ff" />
      <stop offset="50%" stop-color="#4255ff" />
      <stop offset="100%" stop-color="#2136e7" />
    </linearGradient>
    <linearGradient id="pen-body" x1="180" y1="30" x2="270" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="50%" stop-color="#ffcd1f" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="coffee-mug" x1="220" y1="110" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#eef2ff" />
      <stop offset="100%" stop-color="#c9d1ff" />
    </linearGradient>
    <linearGradient id="plane-grad" x1="60" y1="120" x2="130" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="160" cy="100" r="95" fill="#eef2ff" opacity="0.75" />
  <circle cx="240" cy="60" r="45" fill="#fef3c7" opacity="0.6" />

  <!-- Clay Notebook Cover (Base) -->
  <rect x="44" y="34" width="172" height="132" rx="18" fill="url(#notebook-cover)" filter="url(#clay-banner-shadow)" />
  <!-- Clay Highlight Arc on Cover -->
  <path d="M 48 46 A 14 14 0 0 1 62 34 L 198 34 A 14 14 0 0 1 212 46 Z" fill="#ffffff" opacity="0.3" />

  <!-- Clay Notebook Pages (Open White Surface) -->
  <rect x="52" y="42" width="156" height="116" rx="12" fill="url(#notebook-bg)" filter="url(#clay-soft-shadow)" />

  <!-- Notebook Spine Divider -->
  <line x1="130" y1="42" x2="130" y2="158" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Ruled Text Lines on Pages -->
  <!-- Left page lines -->
  <rect x="64" y="58" width="50" height="5" rx="2.5" fill="#4255ff" opacity="0.25" />
  <rect x="64" y="70" width="44" height="4" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="64" y="80" width="52" height="4" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="64" y="90" width="38" height="4" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="64" y="100" width="48" height="4" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="64" y="112" width="32" height="6" rx="3" fill="#10b981" opacity="0.65" />

  <!-- Right page lines -->
  <rect x="144" y="58" width="48" height="5" rx="2.5" fill="#4255ff" opacity="0.25" />
  <rect x="144" y="70" width="50" height="4" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="144" y="80" width="42" height="4" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="144" y="90" width="46" height="4" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="144" y="100" width="36" height="4" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="144" y="112" width="40" height="6" rx="3" fill="#ffcd1f" opacity="0.75" />

  <!-- Bookmark Ribbon -->
  <path d="M 124 34 L 136 34 L 136 64 L 130 58 L 124 64 Z" fill="#f43f5e" filter="url(#clay-soft-shadow)" />

  <!-- Coffee Mug in Right Corner -->
  <g filter="url(#clay-soft-shadow)">
    <rect x="230" y="120" width="44" height="42" rx="14" fill="url(#coffee-mug)" />
    <!-- Mug Handle -->
    <path d="M 274 130 C 286 130 286 152 274 152" stroke="url(#coffee-mug)" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Coffee Surface -->
    <ellipse cx="252" cy="122" rx="17" ry="5" fill="#78350f" />
    <ellipse cx="252" cy="122" rx="12" ry="3" fill="#92400e" />
    <!-- Warm Steam -->
    <path d="M 246 112 Q 244 104 248 98" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 256 110 Q 258 102 254 96" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- 3D Clay Fountain Pen -->
  <g transform="rotate(32 215 90)" filter="url(#clay-banner-shadow)">
    <!-- Pen Barrel -->
    <rect x="210" y="25" width="14" height="85" rx="7" fill="url(#pen-body)" />
    <!-- Pen Grip Section -->
    <rect x="212" y="105" width="10" height="18" rx="3" fill="#2136e7" />
    <!-- Gold Nib -->
    <path d="M 212 123 L 217 138 L 222 123 Z" fill="#ffd700" />
    <circle cx="217" cy="128" r="1.5" fill="#111c2d" />
    <!-- Nib Slit -->
    <line x1="217" y1="128" x2="217" y2="138" stroke="#111c2d" stroke-width="0.8" />
    <!-- Top Cap Clip -->
    <rect x="215" y="32" width="4" height="32" rx="2" fill="#ffffff" opacity="0.85" />
    <!-- Pen Highlights -->
    <path d="M 213 32 L 213 100" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Paper Airplane Floating (Expression/Creative Idea) -->
  <g transform="translate(48, 138) rotate(-18)" filter="url(#clay-soft-shadow)">
    <polygon points="0,15 28,0 36,18 18,16" fill="url(#plane-grad)" />
    <polygon points="0,15 28,0 18,16" fill="#0891b2" />
    <polygon points="18,16 22,24 28,17" fill="#0e7490" />
  </g>

  <!-- Decorative Clay Sparkles -->
  <path d="M 224 34 Q 228 34 228 30 Q 228 34 232 34 Q 228 34 228 38 Q 228 34 224 34 Z" fill="#ffcd1f" opacity="0.9" />
  <path d="M 38 78 Q 43 78 43 73 Q 43 78 48 78 Q 43 78 43 83 Q 43 78 38 78 Z" fill="#4255ff" opacity="0.8" />
  <circle cx="285" cy="45" r="4" fill="#10b981" opacity="0.75" />
  <circle cx="36" cy="120" r="3" fill="#ffcd1f" opacity="0.8" />
</svg>