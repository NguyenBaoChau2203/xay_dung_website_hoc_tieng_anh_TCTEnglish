<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none" role="img" aria-hidden="true">
  <defs>
    <filter id="empty-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#4255ff" flood-opacity="0.16" />
    </filter>
    <filter id="empty-soft" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#111c2d" flood-opacity="0.10" />
    </filter>
    <linearGradient id="doc-card" x1="25" y1="20" x2="105" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f3ff" />
      <stop offset="100%" stop-color="#d8e3fb" />
    </linearGradient>
    <linearGradient id="glass-rim" x1="60" y1="50" x2="125" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7284ff" />
      <stop offset="50%" stop-color="#4255ff" />
      <stop offset="100%" stop-color="#2136e7" />
    </linearGradient>
    <linearGradient id="glass-lens" x1="65" y1="55" x2="115" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="handle-gold" x1="110" y1="110" x2="145" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="50%" stop-color="#ffcd1f" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Disk -->
  <circle cx="80" cy="80" r="66" fill="#f0f3ff" opacity="0.8" />

  <!-- Background Blank Note -->
  <g filter="url(#empty-soft)">
    <rect x="30" y="24" width="70" height="96" rx="12" fill="url(#doc-card)" />
    <!-- Dashed placeholder lines -->
    <rect x="42" y="44" width="36" height="4" rx="2" fill="#cbd5e1" />
    <rect x="42" y="56" width="46" height="4" rx="2" fill="#e2e8f0" />
    <rect x="42" y="68" width="40" height="4" rx="2" fill="#e2e8f0" />
    <rect x="42" y="80" width="32" height="4" rx="2" fill="#e2e8f0" />
  </g>

  <!-- Magnifying Glass (Overlay) -->
  <g filter="url(#empty-shadow)">
    <!-- Lens Rim Outer Ring -->
    <circle cx="92" cy="82" r="30" fill="url(#glass-rim)" />
    <!-- Lens Glass Surface -->
    <circle cx="92" cy="82" r="23" fill="url(#glass-lens)" />
    <!-- Lens Highlight Arc -->
    <path d="M 75 72 A 20 20 0 0 1 106 68" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
    <!-- Reflection dot -->
    <circle cx="78" cy="84" r="2" fill="#ffffff" opacity="0.6" />

    <!-- Handle -->
    <g transform="rotate(45 92 82)">
      <rect x="88" y="112" width="8" height="28" rx="4" fill="url(#handle-gold)" />
      <!-- Handle Collar -->
      <rect x="87" y="110" width="10" height="4" rx="1.5" fill="#1e293b" />
    </g>
  </g>

  <!-- Subtle question mark inside lens -->
  <text x="92" y="90" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#2136e7" text-anchor="middle" opacity="0.85">?</text>

  <!-- Sparkles -->
  <path d="M 128 32 Q 132 32 132 28 Q 132 32 136 32 Q 132 32 132 36 Q 132 32 128 32 Z" fill="#ffcd1f" />
  <circle cx="32" cy="116" r="3" fill="#4255ff" opacity="0.7" />
</svg>