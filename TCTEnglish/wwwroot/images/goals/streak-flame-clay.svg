<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" role="img" aria-hidden="true">
  <defs>
    <filter id="flame-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.28" />
    </filter>
    <filter id="flame-inner-glow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#fef08a" flood-opacity="0.4" />
    </filter>
    <!-- Outer orange-red flame -->
    <linearGradient id="flame-outer-grad" x1="50" y1="20" x2="150" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <!-- Middle warm golden flame -->
    <linearGradient id="flame-mid-grad" x1="60" y1="60" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <!-- Inner bright white-yellow core -->
    <linearGradient id="flame-core-grad" x1="80" y1="100" x2="120" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Ground Reflection/Shadow -->
  <ellipse cx="100" cy="184" rx="55" ry="10" fill="#ea580c" opacity="0.12" />

  <!-- Outer Flame Body (Smooth Clay Curves) -->
  <path d="M 100 16
           C 112 45, 148 68, 154 105
           C 160 142, 136 178, 100 178
           C 64 178, 40 142, 46 105
           C 50 80, 72 58, 80 44
           C 82 65, 92 76, 96 74
           C 102 70, 94 38, 100 16 Z"
        fill="url(#flame-outer-grad)"
        filter="url(#flame-shadow)" />

  <!-- Outer Highlight Glaze -->
  <path d="M 100 24
           C 95 44, 98 62, 88 68
           C 80 58, 62 76, 56 100
           C 52 118, 56 138, 68 152
           C 58 138, 54 116, 60 98
           C 66 76, 84 56, 100 24 Z"
        fill="#ffffff"
        opacity="0.35" />

  <!-- Middle Amber Flame -->
  <path d="M 102 72
           C 114 90, 134 108, 134 130
           C 134 154, 119 168, 100 168
           C 81 168, 66 154, 66 130
           C 66 112, 82 98, 88 88
           C 92 100, 100 106, 104 102
           C 108 96, 98 82, 102 72 Z"
        fill="url(#flame-mid-grad)"
        filter="url(#flame-inner-glow)" />

  <!-- Middle Highlight -->
  <path d="M 88 92 C 78 106, 72 120, 74 136 C 72 124, 76 110, 84 100 C 88 95, 87 93, 88 92 Z" fill="#ffffff" opacity="0.45" />

  <!-- Inner Core (White/Yellow Heat) -->
  <path d="M 100 115
           C 108 126, 116 136, 116 148
           C 116 162, 108 166, 100 166
           C 92 166, 84 162, 84 148
           C 84 136, 92 126, 100 115 Z"
        fill="url(#flame-core-grad)" />

  <!-- Core Glow Accent -->
  <circle cx="100" cy="148" r="8" fill="#ffffff" opacity="0.75" />

  <!-- Floating Sparkles / Embers -->
  <circle cx="148" cy="52" r="3" fill="#f59e0b" opacity="0.8" />
  <circle cx="162" cy="74" r="2" fill="#fb7185" opacity="0.7" />
  <circle cx="48" cy="68" r="2.5" fill="#facc15" opacity="0.8" />
  <path d="M 40 45 Q 44 45 44 41 Q 44 45 48 45 Q 44 45 44 49 Q 44 45 40 45 Z" fill="#fbbf24" opacity="0.8" />
</svg>
