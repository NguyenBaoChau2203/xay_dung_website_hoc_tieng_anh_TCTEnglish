<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" role="img" aria-hidden="true">
  <defs>
    <!-- Clay drop shadows -->
    <filter id="clay-shadow-outer" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#2136e7" flood-opacity="0.18" />
    </filter>
    <filter id="clay-shadow-soft" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#111c2d" flood-opacity="0.12" />
    </filter>
    <!-- Outer ring gradient -->
    <linearGradient id="ring-outer" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7284ff" />
      <stop offset="50%" stop-color="#4255ff" />
      <stop offset="100%" stop-color="#2136e7" />
    </linearGradient>
    <!-- Middle ring gradient -->
    <linearGradient id="ring-mid" x1="45" y1="45" x2="155" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f3ff" />
      <stop offset="100%" stop-color="#d8e3fb" />
    </linearGradient>
    <!-- Inner bullseye gradient -->
    <linearGradient id="bullseye" x1="65" y1="65" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7b72" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <!-- Center golden dot -->
    <linearGradient id="center-gold" x1="88" y1="88" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="100%" stop-color="#ffcd1f" />
    </linearGradient>
    <!-- Arrow shaft & feather -->
    <linearGradient id="arrow-wood" x1="100" y1="10" x2="160" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Outer Clay Base Ring -->
  <circle cx="100" cy="104" r="82" fill="#2136e7" opacity="0.15" />
  <circle cx="100" cy="100" r="80" fill="url(#ring-outer)" filter="url(#clay-shadow-outer)" />
  <!-- Clay Top Highlight Arc -->
  <path d="M 35 75 A 72 72 0 0 1 165 75 A 68 64 0 0 0 35 75 Z" fill="#ffffff" opacity="0.32" />

  <!-- Middle White Clay Ring -->
  <circle cx="100" cy="100" r="56" fill="url(#ring-mid)" filter="url(#clay-shadow-soft)" />
  <!-- Middle Highlight -->
  <path d="M 54 82 A 50 50 0 0 1 146 82 A 47 44 0 0 0 54 82 Z" fill="#ffffff" opacity="0.6" />

  <!-- Inner Red Bullseye -->
  <circle cx="100" cy="100" r="34" fill="url(#bullseye)" filter="url(#clay-shadow-soft)" />
  <!-- Bullseye Highlight -->
  <ellipse cx="94" cy="85" rx="18" ry="8" fill="#ffffff" opacity="0.35" transform="rotate(-15 94 85)" />

  <!-- Center Golden Target Pip -->
  <circle cx="100" cy="100" r="14" fill="url(#center-gold)" filter="url(#clay-shadow-soft)" />
  <circle cx="96" cy="96" r="3.5" fill="#ffffff" opacity="0.8" />

  <!-- Dart / Arrow in Bullseye -->
  <g transform="rotate(35 100 100)" filter="url(#clay-shadow-soft)">
    <!-- Shaft -->
    <rect x="97" y="18" width="6" height="85" rx="3" fill="url(#arrow-wood)" />
    <!-- Feather Fletching -->
    <path d="M 97 18 L 84 4 L 97 12 Z" fill="#4255ff" />
    <path d="M 103 18 L 116 4 L 103 12 Z" fill="#ffcd1f" />
    <path d="M 97 28 L 86 16 L 97 22 Z" fill="#2136e7" />
    <path d="M 103 28 L 114 16 L 103 22 Z" fill="#eab308" />
    <!-- Arrow Head Point -->
    <path d="M 95 100 L 100 108 L 105 100 Z" fill="#475569" />
  </g>

  <!-- Sparkles -->
  <path d="M 160 38 Q 166 38 166 32 Q 166 38 172 38 Q 166 38 166 44 Q 166 38 160 38 Z" fill="#ffcd1f" opacity="0.85" />
  <path d="M 32 140 Q 37 140 37 135 Q 37 140 42 140 Q 37 140 37 145 Q 37 140 32 140 Z" fill="#4255ff" opacity="0.7" />
</svg>
